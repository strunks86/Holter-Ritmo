# Registro de funciones de HolterIA: estado y evidencia (tarea T09).
#
# Origen: tabla de RESPUESTAS-SECCION19.md seccion 10 (no versionada en este
# repositorio). Cada funcion declara en que estado esta, donde se ve en la
# interfaz y que evidencia la respalda.
#
# Estados
#   visible       implementada, con prueba automatica y sin inferencia clinica
#                 pendiente de validar. Es el unico estado que puede aparecer
#                 en el informe (report: true).
#   experimental  implementada pero NO validada. La interfaz la muestra con la
#                 franja "exploratorio, no validado". Nunca aparece en el
#                 informe mientras este en este estado.
#   hidden        no disponible para el usuario: no implementada, sin modelo
#                 validado o deshabilitada. La interfaz la oculta (ui.*) y el
#                 motivo queda en `reason`.
#
# Campos
#   id              identificador estable, unico, de la forma area.funcion
#   name            nombre legible
#   area            import | view | analysis | rhythm | measure | quality |
#                   model | report | export | manage | interop
#   status          visible | experimental | hidden
#   reason          por que no es visible (obligatorio si no es visible)
#   report          true si el informe puede mostrarla cuando este visible
#   report_markers  frases que solo deben aparecer en el informe si esta visible
#   ui.tabs         valores de data-tab que la representan
#   ui.panes        ids de paneles (.pane) que la representan
#   ui.ids          otros ids del HTML que la representan
#   ui.selectors    selectores CSS adicionales (controles sin id)
#   evidence        rutas del repositorio que la respaldan (pruebas, docs, codigo)
version: 1
updated: "2026-11-13"
source: "RESPUESTAS-SECCION19.md seccion 10 + docs/producto/matriz_funciones.md"

statuses:
  visible: "Implementada y probada; el informe puede mostrarla."
  experimental: "Implementada pero no validada; se muestra con franja de aviso."
  hidden: "No disponible; la interfaz la oculta."

rules:
  - "El informe solo muestra funciones en estado visible."
  - "El estado experimental nunca se informa mientras no se valide."
  - "Pasar una funcion a visible exige evidencia nueva en este archivo."

