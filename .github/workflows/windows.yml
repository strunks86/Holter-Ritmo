name: Windows (.exe)

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit que se arma (vacío = esta rama)'
        required: false
        default: ''
      publicar:
        description: 'Publicar como versión de GitHub (vX.Y.Z), descargable sin iniciar sesión'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NODE_VERSION: '22.12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Node portátil para el motor
        shell: pwsh
        run: |
          $u = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest $u -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp
          New-Item -ItemType Directory -Force holterlocal/node | Out-Null
          Copy-Item "nodetmp/node-v$env:NODE_VERSION-win-x64/node.exe" holterlocal/node/
          Copy-Item "nodetmp/node-v$env:NODE_VERSION-win-x64/LICENSE" holterlocal/node/LICENSE-node.txt

      - name: Holter de ejemplo (PhysioNet LTAFDB 00, licencia ODC-By)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force holterlocal/ejemplo | Out-Null
          foreach ($e in 'hea','dat','atr') {
            Invoke-WebRequest "https://physionet-open.s3.amazonaws.com/ltafdb/1.0.0/00.$e" -OutFile "holterlocal/ejemplo/00.$e"
          }

      - name: Pruebas del motor
        run: |
          holterlocal\node\node.exe pruebas\motor.js holterlocal\ejemplo\00.hea

      - name: Compilar el exportador de HScribe (x86)
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /platform:x86 /optimize /out:holterlocal\hscribe\export180.exe holterlocal\hscribe\export180.cs
          if ($LASTEXITCODE -ne 0) { throw 'no compiló export180' }

      - name: Armar el .exe
        run: pyinstaller --noconfirm --distpath dist --workpath build empaquetado/HolterLocal.spec

      - name: Abrir el .exe y probarlo en Windows (los dos motores)
        shell: pwsh
        run: |
          foreach ($m in 'estacion', 'holterai', 'mixto') {
            $dir = "$PWD\autoprueba\$m"
            $p = Start-Process -FilePath dist\HolterLocal\HolterLocal.exe -ArgumentList '--motor', $m, '--autoprueba', $dir -PassThru
            $fin = (Get-Date).AddMinutes(45); $salida = $null
            while ((Get-Date) -lt $fin) {
              if ($p.HasExited) { break }
              $l = $null
              if (Test-Path "$dir\autoprueba.txt") { $l = Select-String -Path "$dir\autoprueba.txt" -Pattern '^salida (\d+)$' }
              if ($l) { $salida = [int]$l.Matches[0].Groups[1].Value; Start-Sleep 10; break }
              Start-Sleep 5
            }
            if (-not $p.HasExited) { Write-Host "::warning::El proceso ($m) seguía abierto 10 s después de terminar; se cierra a la fuerza"; $p.Kill() }
            if (Test-Path "$dir\autoprueba.txt") { Get-Content "$dir\autoprueba.txt" }
            if ($salida -eq $null) {
              if (-not $p.HasExited -or (Get-Date) -ge $fin) { throw "La autoprueba ($m) no terminó en 45 minutos" }
              $salida = $p.ExitCode
            }
            if ($salida -ne 0) { throw "La autoprueba ($m) falló (código $salida)" }
            if (-not (Select-String -Path "$dir\autoprueba.txt" -Pattern '^OK$' -Quiet)) { throw "La autoprueba ($m) no llegó al final" }
          }
          if (-not (Select-String -Path autoprueba\holterai\autoprueba.txt -Pattern 'motor: holterai' -Quiet)) { throw 'holterai no reemplazó al análisis rápido' }
          if (-not (Select-String -Path autoprueba\mixto\autoprueba.txt -Pattern 'motor: mixto' -Quiet)) { throw 'el modo mixto no se aplicó' }

      - name: Instalador
        id: instalador
        shell: pwsh
        run: |
          $v = (Select-String -Path holterlocal\__init__.py -Pattern "'(.+)'").Matches[0].Groups[1].Value
          $env:HL_VERSION = $v
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force salida | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc empaquetado\instalador.iss
          Compress-Archive -Path dist\HolterLocal -DestinationPath "salida\HolterLocal-$v-portable.zip"
          Get-ChildItem salida

      - uses: actions/upload-artifact@v4
        with:
          name: HolterLocal-Windows
          path: salida/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoprueba
          path: autoprueba/**
          retention-days: 30

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          files: salida/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.instalador.outputs.version) }}
          target_commitish: ${{ startsWith(github.ref, 'refs/tags/v') && github.sha || inputs.ref || github.sha }}
          name: ${{ format('HolterLocal {0}', steps.instalador.outputs.version) }}
